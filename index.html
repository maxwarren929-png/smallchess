<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chesslite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: 'Silkscreen', 'Courier New', monospace; color: #fff3d6; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  #hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 3px 3px 0 #120c1c; }
  .coin { display: inline-block; width: .7em; height: .7em; background: #ffc83d; box-shadow: inset -.14em -.14em 0 #c9781f, 0 0 0 .14em #120c1c; margin-right: .35em; vertical-align: baseline; }
  #gold { position: absolute; left: 24px; top: 18px; font-size: 34px; font-weight: 700; transition: transform .12s; transform-origin: left center; }
  #gold.bump { transform: scale(1.35); color: #ffe27a; transition: none; }
  #gold.poor { animation: poor .45s; }
  @keyframes poor { 0%, 100% { color: #fff3d6; } 15%, 55% { color: #ff5a4a; transform: translateX(-6px); } 35%, 75% { color: #ff5a4a; transform: translateX(6px); } }
  .coin.fly { position: absolute; width: 18px; height: 18px; margin: 0; pointer-events: none; z-index: 5; }
  #reroll.wob { animation: wob .35s; }
  @keyframes wob { 25% { transform: rotate(-8deg) scale(1.08); } 60% { transform: rotate(6deg); } }
  #reroll span.tick { display: inline-block; animation: tick .4s cubic-bezier(.2, 2.2, .4, 1); }
  @keyframes tick { from { transform: scale(2) translateY(-6px); color: #ffe27a; } }
  #track { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  #track i { width: 12px; height: 12px; background: #2a2338; box-shadow: 0 0 0 3px #120c1c; }
  #track i.boss { width: 16px; height: 16px; transform: rotate(45deg); margin: 0 5px; background: #4a2030; }
  #track i.done { background: #fff3d6; }
  #track i.boss.done { background: #ff5a4a; }
  #track i.now { background: #ffc83d; animation: blink .7s steps(2) infinite; }
  #track.long { gap: 14px; } #track.long span { display: flex; gap: 6px; align-items: center; }
  #track.long i { width: 8px; height: 8px; box-shadow: 0 0 0 2px #120c1c; } #track.long i.boss { width: 11px; height: 11px; margin: 0 3px; }
  @media (max-width: 520px) { #track.long { gap: 8px; } #track.long span { gap: 3px; } #track.long i { width: 6px; height: 6px; } #track.long i.boss { width: 8px; height: 8px; margin: 0 2px; } }
  #timer { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); font-size: 26px; display: flex; gap: 8px; align-items: center; }
  #timer i { width: 10px; height: 10px; background: #2a2338; box-shadow: 0 0 0 3px #120c1c; }
  #timer i.on { background: #ff5a4a; }
  #big { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: min(11vw, 120px); font-weight: 700; letter-spacing: .06em; opacity: 0; text-shadow: 6px 6px 0 #120c1c; }
  #big small { display: block; font-size: .22em; font-weight: 400; margin-top: 1em; animation: blink 1s steps(2) infinite; }
  #big.show { opacity: 1; animation: slam .35s cubic-bezier(.2, 2.2, .4, 1); }
  #big.flash { animation: slam .35s cubic-bezier(.2, 2.2, .4, 1), out .4s 1.1s forwards; opacity: 1; }
  #bar { position: absolute; left: 0; right: 0; bottom: 26px; display: none; justify-content: center; gap: 18px; }
  #bar.on { display: flex; }
  button { pointer-events: auto; font: inherit; font-size: 26px; font-weight: 700; color: #fff3d6; background: #3b2f58; border: 0; padding: 10px 22px 12px; cursor: pointer;
    box-shadow: 0 0 0 4px #120c1c, inset 0 -6px 0 #241b3a, inset 0 4px 0 #56467c; text-shadow: 2px 2px 0 #120c1c; }
  button:hover { background: #4c3d70; transform: translateY(-2px); }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 4px #120c1c, inset 0 -2px 0 #241b3a; }
  #go { background: #2f7a55; box-shadow: 0 0 0 4px #120c1c, inset 0 -6px 0 #1d5238, inset 0 4px 0 #49a877; padding-left: 34px; padding-right: 34px; }
  #go:hover { background: #3b966a; }
  #sell { display: none; background: #7a2f3a; box-shadow: 0 0 0 4px #120c1c, inset 0 -6px 0 #4f1c25, inset 0 4px 0 #a8495a; }
  #sell.on { display: block; animation: slam .25s cubic-bezier(.2, 2.2, .4, 1); }
  #sell:hover { background: #943948; }
  .price { position: absolute; font-size: 22px; font-weight: 700; transform: translate(-50%, -50%); white-space: nowrap; display: none; }
  .price.no { color: #ff6b5a; }
  .pips { display: block; text-align: center; line-height: 0; margin-bottom: 8px; }
  .pips i { display: inline-block; width: 9px; height: 9px; background: #ff5a4a; margin: 0 3px; box-shadow: 0 0 0 3px #120c1c; }
  #tip { position: absolute; display: none; background: #120c1c; padding: 6px 10px 8px; font-size: 14px; box-shadow: 0 0 0 3px #fff3d6; text-shadow: none; transform: translate(-50%, -140%); white-space: nowrap; text-align: center; }
  #tip b { display: block; font-size: 18px; color: #ffc83d; }
  #tip b s { text-decoration: none; color: #ff5a4a; }
  #tip em { display: inline-block; font-style: normal; font-size: 12px; margin-top: 5px; padding: 1px 5px 2px; background: #3b2f58; color: #fff3d6; }
  #tip em.stun { background: #c9a035; color: #120c1c; } #tip em.ice { background: #4aa6d6; color: #120c1c; } #tip em.gear { background: #5a8f6a; color: #120c1c; }
  #err { position: absolute; left: 8px; bottom: 8px; color: #ff6b5a; font: 12px monospace; white-space: pre-wrap; max-width: 90vw; }
  #book { position: absolute; right: 22px; top: 16px; padding: 8px 12px 10px; font-size: 20px; }
  #book i { display: inline-block; width: 16px; height: 20px; background: #c9a35a; box-shadow: inset 4px 0 0 #7a4f2a, inset -3px 0 0 #fff3d6; vertical-align: middle; }
  #codex { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; text-shadow: 2px 2px 0 #120c1c;
    background: repeating-conic-gradient(rgba(7, 6, 12, .55) 0 25%, transparent 0 50%) 0 0 / 6px 6px, rgba(7, 6, 12, .6); }
  #codex.on { display: flex; }
  .cx-box { position: relative; width: min(940px, calc(100vw - 48px)); max-height: calc(100vh - 56px); display: flex; flex-direction: column; animation: slam .3s cubic-bezier(.2, 1.8, .4, 1);
    background: repeating-conic-gradient(#1f1830 0 25%, #1b1528 0 50%) 0 0 / 4px 4px;
    box-shadow: 0 0 0 4px #120c1c, 0 0 0 8px #c9a35a, inset 0 4px 0 #3b2f58, 0 0 0 11px #7a4f2a, 0 0 0 15px #120c1c, 14px 14px 0 15px rgba(0, 0, 0, .45); }
  .cx-box::before, .cx-box::after { content: ''; position: absolute; top: -14px; width: 16px; height: 16px; background: #ff5a4a; transform: rotate(45deg); box-shadow: 0 0 0 4px #120c1c, inset -4px -4px 0 #a8302a; }
  .cx-box::before { left: -14px; } .cx-box::after { right: -14px; }
  .cx-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 16px 18px 12px; border-bottom: 4px solid #120c1c; box-shadow: 0 4px 0 #3b2f58; }
  .cx-head h2 { margin: 0; font-size: 34px; color: #ffc83d; letter-spacing: .06em; text-shadow: 4px 4px 0 #120c1c; animation: slam .4s .05s cubic-bezier(.2, 2.2, .4, 1) backwards; }
  .cx-tabs { display: flex; gap: 12px; }
  .cx-tabs button { font-size: 17px; padding: 6px 14px 9px; }
  .cx-tabs button.on { background: #ffc83d; color: #120c1c; text-shadow: none; box-shadow: 0 0 0 4px #120c1c, inset 0 -5px 0 #c9781f, inset 0 4px 0 #ffe9a0; transform: translateY(2px); }
  .cx-prog { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .cx-prog i { width: 8px; height: 8px; background: #2a2338; box-shadow: 0 0 0 2px #120c1c; }
  .cx-prog i.on { background: #fff3d6; }
  .cx-prog span { margin-left: 8px; font-size: 15px; color: #8f83ad; }
  .cx-x { margin-left: auto; font-size: 18px; padding: 4px 12px 7px; background: #7a2f3a; box-shadow: 0 0 0 4px #120c1c, inset 0 -5px 0 #4f1c25, inset 0 4px 0 #a8495a; }
  .cx-x:hover { background: #943948; }
  .cx-grid { overflow-y: auto; display: grid; gap: 18px; padding: 20px 20px 18px; scrollbar-color: #56467c #120c1c; }
  .cx-grid.pc { grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); }
  .cx-grid.rl { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .card { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; justify-items: center; padding: 12px; background: #2f2547;
    box-shadow: 0 0 0 4px #120c1c, inset 0 -6px 0 #221a36, inset 0 4px 0 #4a3c6c; animation: pop .35s var(--d) cubic-bezier(.2, 1.8, .4, 1) backwards; transition: transform .1s; }
  .rl .card { grid-template-columns: 1fr; }
  .card:hover { transform: translateY(-4px); background: #3a2e58; }
  .card:hover .pic img { animation: bob .5s steps(2) infinite; }
  .pic { position: relative; width: 128px; height: 128px; background: #0d0b16; box-shadow: 0 0 0 3px #120c1c, 0 0 0 6px #56467c, 0 0 0 9px #120c1c; }
  .pic img { display: block; width: 128px; height: 128px; image-rendering: pixelated; }
  .pic em { position: absolute; left: -6px; top: -10px; font-style: normal; font-size: 17px; font-weight: 700; text-shadow: 2px 2px 0 #120c1c, -2px -2px 0 #120c1c, 2px -2px 0 #120c1c, -2px 2px 0 #120c1c; }
  .plate { grid-column: 1 / -1; width: 100%; box-sizing: border-box; text-align: center; padding: 7px 8px 9px; background: #120c1c; box-shadow: inset 0 0 0 2px #3b2f58; }
  .plate b { display: block; font-size: 18px; color: #ffc83d; letter-spacing: .05em; }
  .plate span { display: block; font-size: 12px; color: #d8cbe8; margin-top: 4px; }
  .card.unk { background: #221b33; }
  .card.unk .plate b { color: #5a4f72; } .card.unk .plate span { color: #4a4060; }
  .dg { display: grid; grid-template-columns: repeat(6, 16px); gap: 0; box-shadow: 0 0 0 3px #120c1c, 0 0 0 6px #c9a35a, 0 0 0 9px #120c1c; }
  .dg.q { display: flex; width: 96px; height: 96px; align-items: center; justify-content: center; font-size: 44px; color: #3b2f58; background: #1b1528; }
  .dg i { width: 16px; height: 16px; position: relative; }
  .dg i.l { background: #e8dcc0; } .dg i.d { background: #5d8a8e; }
  .dg i.me { background: #ffc83d; box-shadow: inset 0 0 0 3px #120c1c; }
  .dg i.mv::after { content: ''; position: absolute; inset: 5px; background: #35d6f0; box-shadow: 0 0 0 2px #120c1c; }
  .dg i.cp, .dg i.sh, .dg i.pl, .dg i.ps, .dg i.sw { box-shadow: inset 0 0 0 3px var(--c); }
  .cp { --c: #ff4a3d; } .sh { --c: #ffa53d; } .pl { --c: #c46bff; } .ps { --c: #ff6fb0; } .sw { --c: #6fd0ff; }
  .cx-key { padding: 12px 18px 16px; font-size: 13px; color: #d8cbe8; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 4px solid #120c1c; box-shadow: inset 0 4px 0 #3b2f58; }
  .cx-key i { width: 14px; height: 14px; display: inline-block; margin-left: 12px; background: #e8dcc0; box-shadow: inset 0 0 0 3px var(--c), 0 0 0 2px #120c1c; }
  .cx-key i.mv { background: #35d6f0; box-shadow: 0 0 0 2px #120c1c; width: 8px; height: 8px; }
  @keyframes pop { from { transform: scale(.5) translateY(14px); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (max-width: 600px) { .cx-head h2 { font-size: 24px; } .cx-grid.pc { grid-template-columns: 1fr; } .cx-box { width: calc(100vw - 32px); } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes slam { from { transform: scale(2.4); opacity: 0; } }
  @keyframes out { to { opacity: 0; transform: scale(.9); } }
  #modes { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); display: none; gap: 18px; }
  #modes.on { display: flex; }
  #modes button { white-space: nowrap; font-size: min(26px, 5.4vw); }
  #pvp { background: #7a2f3a; box-shadow: 0 0 0 4px #120c1c, inset 0 -6px 0 #4f1c25, inset 0 4px 0 #a8495a; }
  #pvp:hover { background: #943948; }
  #track b { font-size: 15px; color: #fff3d6; margin: 0 6px; } #track i.p1.done { background: #8fe0e6; } #track i.p2.done { background: #ff6b5a; }
  #timer b { font-weight: 700; letter-spacing: .06em; } #timer b.p1 { color: #8fe0e6; } #timer b.p2 { color: #ff6b5a; }
#grainTip{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);padding:6px 14px;background:#140c08e0;border:2px solid #c9a24a;color:#f3d98a;font:bold 14px monospace;letter-spacing:2px;pointer-events:none;opacity:0;z-index:50}
#grainTip.on{animation:gtip 1.6s ease-out forwards}
@keyframes gtip{0%{opacity:0;transform:translate(-50%,8px)}10%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="gold"><i class="coin"></i><span>0</span></div>
  <div id="track"></div>
  <div id="timer"></div>
  <div id="big"></div>
  <div class="price"></div><div class="price"></div><div class="price"></div><div class="price"></div>
  <div id="bar"><button id="sell" title="Sell selected piece (Del)">&#10005; SELL <i class="coin"></i><span>1</span></button><button id="reroll">&#8635; <i class="coin"></i><span>1</span></button><button id="go">&#9654;</button></div>
  <div id="tip"></div>
  <button id="book" title="Bestiary (B)"><i></i></button>
  <div id="modes"><button id="regular" title="Solo run against the AI">&#9654; REGULAR</button><button id="pvp" title="Two players, one screen">&#9876; PVP</button></div>
  <div id="codex"></div>
  <div id="err"></div>
</div>
<script>
  addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n'; });
  addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += 'async: ' + (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script src="js/rules.js"></script>
<script src="js/sdf.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/codex.js"></script>
<script src="js/game.js"></script>
<script>
  { const s = new URLSearchParams(location.search).get('shot'); if (s) document.write('<img src="/slow?ms=' + s + '" style="display:none">'); }
</script>
</body>
</html>
